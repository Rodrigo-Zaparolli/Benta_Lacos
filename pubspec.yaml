name: benta_lacos
description: "Projeto Flutter - Benta Laços"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Versões compatíveis atualizadas para o Editor de Texto
  flutter_quill: ^11.5.1
  intl: 0.20.2

  # FIREBASE
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # PDF / RELATÓRIOS
  pdf: ^3.11.3
  printing: ^5.14.2
  fl_chart: ^0.66.2

  # RESTANTE DAS DEPENDÊNCIAS (Atualizadas para evitar conflitos)
  provider: ^6.1.2
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  file_picker: ^8.3.7
  http: ^1.2.1
  brasil_fields: ^1.18.0
  validatorless: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf


  assets:
    # Logos e banners
    - assets/imagens/logo.png
    - assets/imagens/banner_principal.png

    # Pastas gerais
    - assets/imagens/carousel/
    - assets/imagens/icons/
    - assets/imagens/payments/
    - assets/imagens/social/
    - assets/imagens/tela_fundo/
    - assets/imagens/clientes/

    # Produtos
    - assets/imagens/produtos/tiaras/
    - assets/imagens/produtos/lacos/

    # Ícones personalizados
    - assets/imagens/icones_personalizados/laco.png
    - assets/imagens/icones_personalizados/tiara.png
    - assets/imagens/icones_personalizados/presilha.png
    - assets/imagens/icones_personalizados/kit.png
    - assets/imagens/icones_personalizados/faixa.png
